AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Basic Example - Lambda + DynamoDB + GraphQL (Node.js 20, TypeScript compiled to JS)

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs20.x
    MemorySize: 128

Resources:
  ItemsTableStore1:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ItemsStore1
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  AddItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/addItem.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTableStore1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTableStore1

  GetItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/getItem.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTableStore1
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ItemsTableStore1

  ListItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/listItems.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTableStore1
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ItemsTableStore1

Outputs:
  DynamoDBTableName:
    Value: !Ref ItemsTableStore1
    Description: DynamoDB Table